# Local services for `bun run test`. Host ports are offset from the defaults
# (5432 is already taken on the dev machine, and shared's compose uses 55432 /
# 9092) so both stacks can run at once.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tester
      POSTGRES_PASSWORD: tester
      POSTGRES_DB: tester
    ports:
      - '55433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tester -d tester']
      interval: 2s
      timeout: 3s
      retries: 15

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - '59092:59092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:19093,PLAINTEXT_HOST://0.0.0.0:59092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:59092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092',
        ]
      interval: 3s
      timeout: 10s
      retries: 20

  valkey:
    image: valkey/valkey:9.1
    ports:
      - '56379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15

  mongodb:
    image: mongodb/mongodb-community-server:8.3-ubi9-slim
    # The image's entrypoint refuses to start on Linux kernel 6.19+ (MongoDB's
    # allocator compatibility check) and has no override; the dev machine's
    # OrbStack kernel is 7.x. Running mongod directly skips that check — fine
    # for tests (no auth, no init scripts, throwaway data).
    entrypoint: ['mongod']
    command: ['--bind_ip_all']
    ports:
      - '57017:27017'
    healthcheck:
      test: ['CMD', 'bash', '-c', 'echo > /dev/tcp/127.0.0.1/27017']
      interval: 2s
      timeout: 3s
      retries: 15
